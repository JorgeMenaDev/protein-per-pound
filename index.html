<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protein price table</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --bg: #fafafa;
    --card: #ffffff;
    --accent: #0a6b4f;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #ececec;
      --muted: #9a9a9a;
      --line: #2e2e2e;
      --bg: #141414;
      --card: #1c1c1c;
      --accent: #4fd1a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -0.02em; line-height: 1.15; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .sub a { color: inherit; }
  .toolbar {
    display: flex;
    gap: .75rem;
    align-items: center;
    margin-bottom: .75rem;
  }
  input[type="search"] {
    flex: 1;
    padding: .55rem .75rem;
    font: inherit;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  #count { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .table-wrap {
    overflow-x: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  table { border-collapse: collapse; width: 100%; min-width: 980px; }
  th, td { padding: .5rem .75rem; text-align: left; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--fg); }
  thead th.sorted { color: var(--accent); }
  thead th.nosort { cursor: default; }
  thead th.nosort:hover { color: var(--muted); }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  td.name { min-width: 220px; }
  td.thumbcell { width: 56px; padding: .35rem .5rem .35rem .75rem; }
  td.date { color: var(--muted); font-size: .85em; white-space: nowrap; }
  .unit { color: var(--muted); }
  .thumb {
    display: block;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    line-height: 0;
    transition: transform 140ms var(--ease-out);
  }
  .thumb:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) {
    .thumb:hover { transform: scale(1.05); }
  }
  .thumb img {
    display: block;
    width: 40px;
    height: 40px;
    object-fit: cover;
    background: var(--line);
  }
  dialog#lightbox {
    border: 0;
    padding: 0;
    background: transparent;
    max-width: none;
    max-height: none;
    overflow: visible;
  }
  dialog#lightbox::backdrop {
    background: rgba(10, 10, 12, 0.72);
    backdrop-filter: blur(8px);
    transition: opacity 220ms var(--ease-out);
    opacity: 1;
  }
  @starting-style {
    dialog#lightbox[open]::backdrop { opacity: 0; }
  }
  dialog#lightbox.closing::backdrop { opacity: 0; transition-duration: 120ms; }
  #lightbox-img {
    display: block;
    max-width: min(94vw, 1400px);
    max-height: 92vh;
    border-radius: 12px;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
    cursor: zoom-out;
  }
  dialog#lightbox[open] #lightbox-img {
    transform: scale(1);
    opacity: 1;
    transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out);
  }
  @starting-style {
    dialog#lightbox[open] #lightbox-img { transform: scale(0.95); opacity: 0; }
  }
  dialog#lightbox.closing #lightbox-img {
    transform: scale(0.97);
    opacity: 0;
    transition: transform 120ms var(--ease-out), opacity 120ms var(--ease-out);
  }
  @media (prefers-reduced-motion: reduce) {
    .thumb, .thumb:active, .thumb:hover { transform: none; transition: none; }
    dialog#lightbox[open] #lightbox-img,
    dialog#lightbox.closing #lightbox-img {
      transform: none;
      transition: opacity 160ms ease;
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    dialog#lightbox::backdrop { background: rgba(10, 10, 12, 0.94); backdrop-filter: none; }
  }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Protein price table</h1>
  <p class="sub">What a gram of protein costs at the supermarket. Data from the legacy Fitbite app.
    <a href="https://github.com/JorgeMenaDev/protein-price-table">Add an item on GitHub</a>.</p>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Filter items, e.g. lentils, tuna, whey" autocomplete="off">
    <span id="count"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="nosort" aria-label="Photo"></th>
          <th data-key="name">Item</th>
          <th data-key="store">Store</th>
          <th data-key="price" class="num">Price</th>
          <th data-key="size" class="num">Package</th>
          <th data-key="protein" class="num">Protein</th>
          <th data-key="carbs" class="num">Carbs</th>
          <th data-key="ppg" class="num sorted">£ / g protein</th>
          <th data-key="p100" class="num">£ / 100 g protein</th>
          <th data-key="dateAdded">Added</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <footer id="footer"></footer>
</main>
<dialog id="lightbox">
  <img id="lightbox-img" alt="">
</dialog>
<script>
function parseCSV(text) {
  const lines = text.trim().split("\n");
  const header = splitLine(lines[0]);
  return lines.slice(1).map((line) => {
    const cells = splitLine(line);
    const row = {};
    header.forEach((h, i) => (row[h] = cells[i] ?? ""));
    return row;
  });
}

function splitLine(line) {
  const out = [];
  let cur = "";
  let quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (quoted && line[i + 1] === '"') { cur += '"'; i++; }
      else quoted = !quoted;
    } else if (c === "," && !quoted) {
      out.push(cur);
      cur = "";
    } else cur += c;
  }
  out.push(cur);
  return out;
}

function totalProtein(r) {
  return r.package_unit === "piece"
    ? r.package_size * r.protein_per_piece
    : (r.package_size * r.protein_per_100g) / 100;
}

function num(v) {
  return v === "" ? null : Number(v);
}

function toRow(r) {
  const protein = totalProtein(r);
  const ppg = protein > 0 ? Number(r.price_gbp) / protein : 0;
  return {
    name: r.name,
    store: r.store,
    price: Number(r.price_gbp),
    size: Number(r.package_size),
    unit: r.package_unit,
    protein: num(r.package_unit === "piece" ? r.protein_per_piece : r.protein_per_100g),
    proteinUnit: r.package_unit === "piece" ? "/piece" : "/100g",
    carbs: num(r.carbs_per_100g),
    ppg: r.price_per_g_protein !== "" ? Number(r.price_per_g_protein) : ppg,
    p100: r.price_per_100g_protein !== "" ? Number(r.price_per_100g_protein) : ppg * 100,
    dateAdded: r.date_added ?? "",
    image: r.image_url ?? "",
  };
}

const tbody = document.getElementById("rows");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
let data = [];
let sortKey = "ppg";
let sortDir = 1;

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const filtered = data.filter(
    (r) => !q || r.name.toLowerCase().includes(q) || r.store.toLowerCase().includes(q),
  );
  filtered.sort((a, b) => {
    const x = a[sortKey];
    const y = b[sortKey];
    const cmp = typeof x === "number" && typeof y === "number"
      ? x - y
      : String(x).localeCompare(String(y));
    return cmp * sortDir;
  });
  tbody.innerHTML = filtered
    .map(
      (r) => `<tr>
        <td class="thumbcell">${r.image ? `<button class="thumb" data-img="${escapeHtml(r.image)}" aria-label="View photo of ${escapeHtml(r.name)}"><img src="${escapeHtml(r.image)}" alt="" loading="lazy"></button>` : ""}</td>
        <td class="name">${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.store)}</td>
        <td class="num">£${r.price.toFixed(2)}</td>
        <td class="num">${r.size} ${r.unit}</td>
        <td class="num">${r.protein ?? ""} <span class="unit">${r.protein !== null ? r.proteinUnit : ""}</span></td>
        <td class="num">${r.carbs ?? ""}</td>
        <td class="num">£${Number(r.ppg).toFixed(4)}</td>
        <td class="num">£${Number(r.p100).toFixed(2)}</td>
        <td class="date">${escapeHtml(r.dateAdded)}</td>
      </tr>`,
    )
    .join("");
  countEl.textContent = `${filtered.length} / ${data.length}`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function openLightbox(url, alt) {
  lightboxImg.src = url;
  lightboxImg.alt = alt;
  lightbox.showModal();
}

function closeLightbox() {
  lightbox.classList.add("closing");
  setTimeout(() => {
    lightbox.classList.remove("closing");
    lightbox.close();
    lightboxImg.src = "";
  }, 130);
}

tbody.addEventListener("click", (e) => {
  const btn = e.target.closest(".thumb");
  if (!btn) return;
  const name = btn.getAttribute("aria-label").replace(/^View photo of /, "");
  openLightbox(btn.dataset.img, name);
});

lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
});

lightbox.addEventListener("cancel", (e) => {
  e.preventDefault();
  closeLightbox();
});

document.querySelectorAll("thead th[data-key]").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir = -sortDir;
    else { sortKey = key; sortDir = 1; }
    document.querySelectorAll("thead th").forEach((h) => h.classList.remove("sorted"));
    th.classList.add("sorted");
    render();
  });
});

searchEl.addEventListener("input", render);

fetch("data/protein-sources.csv")
  .then((r) => r.text())
  .then((text) => {
    data = parseCSV(text).map(toRow);
    render();
  });
</script>
</body>
</html>
